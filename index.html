<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Stefan Anderson</title>
<meta name="description" content="Stefan Anderson GitHub Page">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>
<h1 style="position:absolute; left:-9999px;">
  Stefan Anderson
</h1>
<audio id="bgAudio" src="sound.wav" loop></audio> 
<canvas id="space"></canvas>
<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
  
let w, h;
// --- Initiera canvas första gången ---
function resizeInitial() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resizeInitial();

// --- Spara gamla mått efter första init ---
let oldW = w;
let oldH = h;

// --- Tre lager stjärnor ---
const layers = [
  { count: 100, color: '#f2d675', speed: 0.1, size: 1 },
  { count: 80,  color: '#d8c27a', speed: 0.5, size: 1.5 },
  { count: 60,  color: '#fff2b0', speed: 2.5, size: 2 }
];

for (const layer of layers) {
  layer.stars = Array.from({length: layer.count}, () => ({
    x: Math.random() * w,
    y: Math.random() * h
  }));
}

// --- Korrekt resize med skalning ---
function resize() {
  // Spara gamla mått
  oldW = w;
  oldH = h;

  // Sätt nya mått
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;

  // Skalningsfaktorer
  const scaleX = w / oldW;
  const scaleY = h / oldH;

  // Skala stjärnor proportionellt
  for (const layer of layers) {
    for (const s of layer.stars) {
      s.x *= scaleX;
      s.y *= scaleY;
    }
  }
}

window.addEventListener('resize', resize);
  
// Sinus-scroll för namn
const text = "Stefan Anderson";
let textX = w;
const amplitude = 150;
const frequency = 0.01;
const textSpeed = 4;

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  // Rita stjärnor
  for (const layer of layers) {
    ctx.fillStyle = layer.color;
    for (const s of layer.stars) {
      s.x -= layer.speed;
      if (s.x < 0) s.x = w;
      ctx.beginPath();
      ctx.arc(s.x, s.y, layer.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Rita namn ovanpå
  ctx.font = "70px Audiowide";
  ctx.fillStyle = "#f2d675";
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const charX = textX + i * 40;
    const charY = h / 2 + Math.sin(charX * frequency) * amplitude;
    ctx.fillText(char, charX, charY);
  }
  textX -= textSpeed;
  const textWidth = ctx.measureText(text).width;
  if (textX + textWidth < -20) textX = w + 20;
  requestAnimationFrame(draw);
}
draw();
  
const audio = document.getElementById('bgAudio');
audio.play();
let pressTimer;

// --- Desktop ---
canvas.addEventListener('click', () => window.location.href = 'https://github.com/teleogenic');
canvas.addEventListener('contextmenu', e => { e.preventDefault(); toggle(); });

// --- Mobil ---
canvas.addEventListener('touchstart', () => {
  pressTimer = setTimeout(() => {
    window.location.href = 'https://github.com/teleogenic';
  }, 500);
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  clearTimeout(pressTimer);
  toggle();
});

function toggle() {
  if (audio.paused) audio.play();
  else audio.pause();
}

</script>
</body>
</html>
